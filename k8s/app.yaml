# k8s/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybridsearch-app
  namespace: hybridsearch
  labels:
    app: hybridsearch-app
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hybridsearch-app
  template:
    metadata:
      labels:
        app: hybridsearch-app
        version: v1
    spec:
      containers:
        - name: hybridsearch-app
          image: hybridsearch/hybridsearch-es:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hybridsearch-secrets
                  key: POSTGRES_PASSWORD
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hybridsearch-secrets
                  key: ELASTICSEARCH_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hybridsearch-secrets
                  key: REDIS_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hybridsearch-secrets
                  key: RABBITMQ_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hybridsearch-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: hybridsearch-secrets
                  key: MINIO_SECRET_KEY
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
            - name: temp-storage
              mountPath: /tmp/exports
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config-volume
          configMap:
            name: hybridsearch-config
        - name: temp-storage
          emptyDir:
            sizeLimit: 10Gi
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
        - name: wait-for-elasticsearch
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z elasticsearch-service 9200; do echo waiting for elasticsearch; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done;']
        - name: wait-for-rabbitmq
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z rabbitmq-service 5672; do echo waiting for rabbitmq; sleep 2; done;']

---
apiVersion: v1
kind: Service
metadata:
  name: hybridsearch-service
  namespace: hybridsearch
  labels:
    app: hybridsearch-app
spec:
  selector:
    app: hybridsearch-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hybridsearch-hpa
  namespace: hybridsearch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hybridsearch-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80