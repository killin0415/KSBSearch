# k8s/postgres.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: hybridsearch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd  # 根據集群調整

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hybridsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: hybridsearch
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hybridsearch-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-scripts
          configMap:
            name: postgres-init-script

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: hybridsearch
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: hybridsearch
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS fineweb_data
    (
        id       UUID PRIMARY KEY,
        text     TEXT  NOT NULL,
        metadata JSONB NOT NULL
    ) PARTITION BY HASH (id);

    CREATE TABLE IF NOT EXISTS fineweb_data_0 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 0);

    CREATE TABLE IF NOT EXISTS fineweb_data_1 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 1);

    CREATE TABLE IF NOT EXISTS fineweb_data_2 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 2);

    CREATE TABLE IF NOT EXISTS fineweb_data_3 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 3);

    CREATE TABLE IF NOT EXISTS fineweb_data_4 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 4);

    CREATE TABLE IF NOT EXISTS fineweb_data_5 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 5);

    CREATE TABLE IF NOT EXISTS fineweb_data_6 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 6);

    CREATE TABLE IF NOT EXISTS fineweb_data_7 PARTITION OF fineweb_data
        FOR VALUES WITH (MODULUS 8, REMAINDER 7);