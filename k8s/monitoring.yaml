# k8s/monitoring.yaml
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: hybridsearch-metrics
  namespace: hybridsearch
  labels:
    app: hybridsearch-app
spec:
  selector:
    matchLabels:
      app: hybridsearch-app
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s

---
apiVersion: v1
kind: Service
metadata:
  name: hybridsearch-metrics
  namespace: hybridsearch
  labels:
    app: hybridsearch-app
spec:
  selector:
    app: hybridsearch-app
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
  type: ClusterIP