server:
  port: 8877
  tomcat:
    max-threads: 200
    min-spare-threads: 10

spring:
  # R2DBC PostgreSQL Configuration - Production
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-service}:${DB_PORT:5432}/${DB_NAME:hybridsearch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 20
      max-size: 100
      max-idle-time: 10m
      validation-query: SELECT 1
      max-acquire-time: 60s
      max-create-connection-time: 60s

  # Elasticsearch Configuration - Production
  elasticsearch:
    uris: ${ES_URIS:http://elasticsearch-service:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD}
    connection-timeout: 30s
    socket-timeout: 60s

  # Redis Configuration - Production
  data:
    redis:
      host: ${REDIS_HOST:redis-service}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 10s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 10s
        shutdown-timeout: 100ms

  # RabbitMQ Configuration - Production
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-service}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        concurrency: 10
        max-concurrency: 20
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 5
          max-interval: 10000ms

  # Cache Configuration - Production
  cache:
    type: redis
    redis:
      time-to-live: 1800000 # 30 minutes
      cache-null-values: false

# MinIO Configuration - Production
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio-service:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:hybridsearch-prod}

# Application Specific Configuration - Production
app:
  search:
    max-results: 50000
    default-page-size: 20
    max-page-size: 200
  export:
    max-file-size: 5GB
    compression-level: 6
    temp-dir: /app/temp/exports

# Logging Configuration - Production
logging:
  level:
    com.hybridsearch: INFO
    org.springframework.data.elasticsearch: WARN
    org.springframework.data.r2dbc: WARN
    reactor.netty: WARN
    org.springframework.cache: WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: /app/logs/hybrid-search-prod.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB

# Management/Actuator Configuration - Production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
    info:
      show-values: when-authorized
  server:
    port: 8878  # 不同的管理端口
  security:
    enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60s

# Security Configuration - Production
security:
  require-ssl: true
  headers:
    frame-options: DENY
    content-type-options: nosniff
    xss-protection: 1; mode=block

# JVM and Performance Tuning - Production
spring:
  jmx:
    enabled: true
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 100
    scheduling:
      pool:
        size: 5
