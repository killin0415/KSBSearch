server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: hybrid-search-es

  # 基本配置 - 會被環境特定配置覆蓋
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/hybridsearch
    username: postgres
    password: password
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      validation-query: SELECT 1

  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: password
    connection-timeout: 10s
    socket-timeout: 30s

  data:
    redis:
      host: localhost
      port: 6379
      password: password
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
      cache-null-values: false

# MinIO Configuration
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: hybridsearch-exports

# Application Specific Configuration
app:
  search:
    max-results: 10000
    default-page-size: 20
    max-page-size: 100
  export:
    max-file-size: 1GB
    compression-level: 6
    temp-dir: /tmp/exports

# Logging Configuration - 簡化，主要由 logback-spring.xml 控制
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO

# Management/Actuator Configuration
management:
  endpoints:
    web:
      cors:
        allowed-methods: "GET POST PUT DELETE OPTIONS"
        allowed-headers: '*'
        allow-credentials: true
        allowed-origins:
          - "http://localhost:3000"  # 前端開發環境
          - "http://localhost:8080"  # 其他可能的前端端點
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
